<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مولد لایسنس و کد فعال‌سازی آرکا (نسخه ادمین)</title>
  <style>
    * { box-sizing: border-box; font-family: Tahoma, Vazirmatn, sans-serif; }
    body {
      background: #0f172a;
      color: #f8fafc;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 20px;
      padding: 24px;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
    }
    .header {
      text-align: center;
      border-b: 1px solid #334155;
      padding-bottom: 16px;
      margin-bottom: 20px;
    }
    .badge {
      background: #065f46;
      color: #34d399;
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: bold;
      display: inline-block;
      margin-bottom: 8px;
    }
    h1 { font-size: 18px; margin: 0; color: #ffffff; }
    p { font-size: 12px; color: #94a3b8; margin: 6px 0 0; }
    .group { margin-bottom: 16px; }
    label { display: block; font-size: 12px; font-weight: bold; margin-bottom: 6px; color: #cbd5e1; }
    input {
      width: 100%;
      padding: 12px;
      border-radius: 12px;
      border: 1px solid #475569;
      background: #0f172a;
      color: #38bdf8;
      font-size: 15px;
      font-weight: bold;
      text-align: center;
      direction: ltr;
      letter-spacing: 1px;
    }
    input:focus { outline: none; border-color: #38bdf8; box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2); }
    button {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: none;
      background: #0284c7;
      color: white;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s;
    }
    button:hover { background: #0369a1; }
    .result-box {
      margin-top: 20px;
      background: #0f172a;
      border: 1px solid #0284c7;
      border-radius: 16px;
      padding: 16px;
      text-align: center;
      display: none;
    }
    .result-box.active { display: block; }
    .key-display {
      font-size: 20px;
      font-weight: 900;
      color: #4ade80;
      letter-spacing: 2px;
      direction: ltr;
      margin: 10px 0;
      word-break: break-all;
    }
    .copy-btn {
      background: #166534;
      color: #86efac;
      padding: 10px;
      font-size: 12px;
      border-radius: 10px;
      margin-top: 8px;
    }
    .copy-btn:hover { background: #15803d; }
  </style>
</head>
<body>

  <div class="card">
    <div class="header">
      <span class="badge">ویژه مدیریت - آفلاین</span>
      <h1>مولد لایسنس و کد فعال‌سازی آرکا</h1>
      <p>تولید کد فعال‌سازی منحصربه‌فرد بر اساس کد دستگاه مشتری</p>
    </div>

    <div class="group">
      <label>کد دستگاه ارسال شده توسط مشتری (System Code):</label>
      <input type="text" id="sysCodeInput" placeholder="مثلاً: ARKA-8F9A-4B2C-1E3D" autocomplete="off" spellcheck="false">
    </div>

    <button type="button" onclick="generateKey()">تولید کد فعال‌سازی اختصاصی</button>

    <div class="result-box" id="resultBox">
      <div style="font-size: 11px; color: #94a3b8;">کد فعال‌سازی اختصاصی (License Key):</div>
      <div class="key-display" id="keyOutput">---- ---- ---- ----</div>
      <button type="button" class="copy-btn" id="copyBtn" onclick="copyKey()">کپی کد جهت ارسال برای مشتری</button>
    </div>
  </div>

  <script>
    const MASTER_SECRET_SALT = 'ARKA_POS_OFFLINE_SECRET_SALT_2026_x987654321_REST_SYS';

    async function sha256Hex(str) {
      if (typeof crypto !== 'undefined' && crypto.subtle) {
        try {
          const msgUint8 = new TextEncoder().encode(str);
          const hashBuffer = await crypto.subtle.digest('SHA-256', msgUint8);
          const hashArray = Array.from(new Uint8Array(hashBuffer));
          return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        } catch (e) {}
      }
      let hash1 = 2166136261;
      let hash2 = 30503041;
      for (let i = 0; i < str.length; i++) {
        const char = str.charCodeAt(i);
        hash1 ^= char;
        hash1 = Math.imul(hash1, 16777619);
        hash2 ^= char;
        hash2 = Math.imul(hash2, 1099511628211 || 16777619);
      }
      const h1Hex = (hash1 >>> 0).toString(16).padStart(8, '0');
      const h2Hex = (hash2 >>> 0).toString(16).padStart(8, '0');
      return h1Hex + h2Hex + h1Hex + h2Hex;
    }

    async function generateKey() {
      const input = document.getElementById('sysCodeInput').value.trim();
      if (!input) {
        alert('لطفاً کد دستگاه مشتری را وارد کنید.');
        return;
      }
      const cleanCode = input.toUpperCase().replace(/[^A-Z0-9]/g, '');
      const combined = cleanCode + '_' + MASTER_SECRET_SALT;
      const hash = await sha256Hex(combined);

      const k1 = hash.substring(0, 4).toUpperCase();
      const k2 = hash.substring(4, 8).toUpperCase();
      const k3 = hash.substring(8, 12).toUpperCase();
      const k4 = hash.substring(12, 16).toUpperCase();

      const finalKey = `${k1}-${k2}-${k3}-${k4}`;

      document.getElementById('keyOutput').innerText = finalKey;
      document.getElementById('resultBox').classList.add('active');
    }

    function copyKey() {
      const keyText = document.getElementById('keyOutput').innerText;
      navigator.clipboard.writeText(keyText).then(() => {
        const btn = document.getElementById('copyBtn');
        btn.innerText = '✔ کپی شد!';
        setTimeout(() => { btn.innerText = 'کپی کد جهت ارسال برای مشتری'; }, 2000);
      });
    }
  </script>
</body>
</html>
